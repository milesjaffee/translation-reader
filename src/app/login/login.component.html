<h1>{{ current() === 'signup' ? 'Create your account' : 'Sign in' }}</h1>

<div class="box">
  <button class="google" type="button" [disabled]="busy()" (click)="google()">
    <svg viewBox="0 0 48 48" width="24" height="24" aria-hidden="true">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z" />
      <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z" />
      <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z" />
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z" />
    </svg>
    Continue with Google
  </button>

  <div class="or" role="separator"><span>or</span></div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (current() === 'signup') {
      <label>
        Name <span class="hint">(shown if you share translations)</span>
        <input class="cr-input" type="text" formControlName="name" autocomplete="name" maxlength="60" />
      </label>
    }
    <label>
      Email
      <input class="cr-input" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="cr-error">Enter a valid email address.</span>
      }
    </label>
    <label>
      Password
      <input
        class="cr-input"
        type="password"
        formControlName="password"
        [attr.autocomplete]="current() === 'signup' ? 'new-password' : 'current-password'"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="cr-error">Passwords need at least 6 characters.</span>
      }
    </label>

    <button class="cr-button" type="submit" [disabled]="busy() || !filled()">
      {{ current() === 'signup' ? 'Sign up' : 'Sign in' }}
    </button>
  </form>

  <p class="message" aria-live="polite">
    @if (error()) {
      <span class="cr-error">{{ error() }}</span>
    } @else if (notice()) {
      {{ notice() }}
    }
  </p>

  <p class="switch">
    @if (current() === 'signup') {
      Already have an account?
      <button class="cr-text-button link" type="button" (click)="setMode('signin')">Sign in</button>
    } @else {
      New to Cratylus?
      <button class="cr-text-button link" type="button" (click)="setMode('signup')">Create an account</button>
      ·
      <button class="cr-text-button link" type="button" (click)="forgotPassword()">Forgot password?</button>
    }
  </p>
</div>
